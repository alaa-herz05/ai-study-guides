<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل دراسة الذكاء الاصطناعي – الشابتر 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#000;--panel:#140b05;--line:#3a1d0a;--or:#ff7a1a;--ord:#d9480f;--tx:#f4ede6;--mut:#b3a191;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.8 Cairo,Tahoma,sans-serif}
h1,h2,h3{font-family:"Chakra Petch",Cairo,sans-serif;line-height:1.3;margin:0 0 .5em}
h1{font-size:clamp(34px,7vw,64px)}h2{font-size:clamp(24px,4vw,34px);color:var(--or)}h3{font-size:20px}
main{max-width:1000px;margin:auto;padding:0 18px 60px}
section{padding:38px 0 10px;border-top:1px solid var(--line)}
nav{position:sticky;top:0;z-index:5;background:#000e;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;overflow-x:auto;align-items:center}
nav a,.tg button{white-space:nowrap;color:var(--tx);text-decoration:none;font-size:14px;padding:4px 12px;border:1px solid var(--line);border-radius:20px;background:none;cursor:pointer;font-family:inherit}
nav a:hover,.tg button.on{background:var(--or);color:#000;border-color:var(--or)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.tg{margin-inline-start:auto;display:flex;gap:6px}
.hero{padding:50px 0 30px;text-align:center}
.hero p{color:var(--mut);max-width:60ch;margin:8px auto}
.hero svg{width:100%;max-width:560px;height:auto}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.bi>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.bi [lang=en]{direction:ltr;text-align:left;font-family:"Chakra Petch",sans-serif;font-weight:500;font-size:15.5px;line-height:1.7}
.bi [lang=ar]{border-inline-start:3px solid var(--or)}
body.en .bi{grid-template-columns:1fr}body.en [lang=ar].x,body.en .bi>[lang=ar]{display:none}
body.ar .bi{grid-template-columns:1fr}body.ar .bi>[lang=en]{display:none}
.bi p{margin:0 0 .5em}.bi ul{margin:0;padding-inline-start:20px}
b,.k{color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.c{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6}
.c i{font-style:normal;font-size:28px;display:block}.c h3{font-size:16px;margin:2px 0;color:var(--or)}
.c small{display:block;color:var(--mut);direction:ltr;text-align:left;font-family:"Chakra Petch",sans-serif}
.ex{border:1px dashed var(--or);border-radius:10px;padding:10px 16px;margin:14px 0;background:#ff7a1a0d}
.ex:before{content:"مثال / Example";color:var(--or);font-weight:800;display:block}
.warn{border:1px solid var(--ord);border-radius:10px;padding:10px 16px;margin:14px 0;background:#d9480f1a}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.wrap{overflow-x:auto}th,td{border:1px solid var(--line);padding:8px 12px;text-align:start;vertical-align:top}th{background:var(--ord);color:#000}td:first-child{color:var(--or);font-weight:600}
svg text{font-family:"Chakra Petch",Cairo,sans-serif;fill:var(--tx)}
.quad{width:100%;max-width:640px;display:block;margin:10px auto}
.tl{list-style:none;padding:0;margin:14px 0;border-inline-start:2px solid var(--ord)}
.tl li{padding:2px 18px 10px;position:relative}.tl li:before{content:"";position:absolute;inset-inline-start:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--or)}
.tl b{font-family:"Chakra Petch",sans-serif;direction:ltr;unicode-bidi:isolate}
.fc{perspective:900px;min-height:130px;cursor:pointer;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:center}
.fc>span{display:flex;align-items:center;justify-content:center;min-height:130px;padding:12px;border-radius:10px;border:1px solid var(--or);background:var(--panel);transition:transform .4s,background .3s}
.fc.f>span{background:var(--ord);color:#000;transform:rotateY(180deg)}.fc.f>span>em{transform:rotateY(180deg)}
.fc em{font-style:normal;font-size:15px;line-height:1.6}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}
.q p{margin:0 0 8px;direction:ltr;text-align:left;font-family:"Chakra Petch",sans-serif}
.q button{display:block;width:100%;direction:ltr;text-align:left;margin:6px 0;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#000;color:var(--tx);font:500 15px "Chakra Petch",sans-serif;cursor:pointer}
.q button:hover:not(:disabled){border-color:var(--or)}
.q button.ok{background:#1f6b2e;border-color:#4ade80;color:#fff}.q button.no{background:#7a1a12;border-color:#f87171;color:#fff}
.q .fb{display:none;color:var(--mut);margin-top:8px;font-size:15px}.q.d .fb{display:block}
#score{position:sticky;bottom:10px;margin:18px auto 0;width:max-content;background:var(--or);color:#000;font-weight:800;padding:6px 20px;border-radius:20px}
.rb{background:var(--or);color:#000;border:0;border-radius:8px;padding:8px 20px;font:800 16px Cairo;cursor:pointer}
@media(max-width:700px){.bi{grid-template-columns:1fr}body{font-size:16px}}
@media(prefers-reduced-motion:no-preference){.pl{animation:p 2.4s infinite}@keyframes p{50%{opacity:.25}}}

body.en [lang=ar]{display:none}body.ar [lang=en]{display:none}
.c span,td span,th span,.ex span,.warn span,h2 span,h3 span,li>span,.hero p span{display:block}
.c span[lang=en],td span[lang=en]{direction:ltr;text-align:left;font-family:"Chakra Petch",sans-serif;font-size:14px;color:var(--mut)}
.c h3 span[lang=en],h2 span[lang=en],h3 span[lang=en]{color:var(--or);font-family:"Chakra Petch",sans-serif;direction:ltr}
.c h3 span[lang=en]{font-size:15px}h2 span[lang=en]{font-size:.7em;color:var(--mut)}
.c ul,td ul{margin:4px 0;padding-inline-start:18px}.c span[lang=en] ul{padding-inline-start:0;padding-left:18px}
td span[lang=en]{margin-bottom:4px}.tl li span[lang=en]{direction:ltr;text-align:left;font-size:14px;color:var(--mut)}
.hero p span[lang=en]{direction:ltr;color:var(--mut)}
nav a span{display:inline}nav a span+span:before{content:" | "}body.en nav a span+span:before,body.ar nav a span+span:before{content:""}
.fc em span{display:block}
nav a.home{background:var(--or);color:#000;border-color:var(--or);font-weight:700}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
<header class="hero">
<svg viewBox="0 0 560 200" role="img" aria-label="Neural network diagram">
<g stroke="#d9480f" stroke-width="1.2" opacity=".8"><path d="M60 40L200 30M60 40L200 100M60 40L200 170M60 100L200 30M60 100L200 100M60 100L200 170M60 160L200 30M60 160L200 100M60 160L200 170M200 30L360 60M200 30L360 140M200 100L360 60M200 100L360 140M200 170L360 60M200 170L360 140M360 60L500 100M360 140L500 100"/></g>
<g fill="#ff7a1a"><circle cx="60" cy="40" r="9"/><circle cx="60" cy="100" r="9"/><circle cx="60" cy="160" r="9"/><circle class="pl" cx="200" cy="30" r="9"/><circle cx="200" cy="100" r="9"/><circle class="pl" cx="200" cy="170" r="9"/><circle cx="360" cy="60" r="9"/><circle class="pl" cx="360" cy="140" r="9"/><circle cx="500" cy="100" r="13"/></g>
<text x="60" y="195" font-size="12" text-anchor="middle">Input</text><text x="280" y="195" font-size="12" text-anchor="middle">Hidden</text><text x="500" y="195" font-size="12" text-anchor="middle">Output</text>

<h1>Introduction to AI</h1>
<p><b>دليل الدراسة الشامل: الفصل الأول</b><br><span lang="en">Bilingual study guide covering every topic in the Chapter 1 slides, Second Semester 2025-2026.</span><span lang="ar">شرح بالعربية والإنجليزية يغطي كل مواضيع سلايدات الفصل الأول، مع أمثلة وأسئلة تفاعلية.</span></p>
</header>
<div id="app"></div>
</main>
<script>
function L(e,a){return "<span lang='en'>"+e+"</span><span lang='ar'>"+a+"</span>"}
function bi(e,a){return "<div class='bi'><div lang='en'>"+e+"</div><div lang='ar'>"+a+"</div></div>"}
function ul(x){return "<ul>"+x.map(function(i){return "<li>"+i+"</li>"}).join("")+"</ul>"}
function sh(e,a){return "<h3>"+L(e,a)+"</h3>"}
function ex(e,a){return "<div class='ex'>"+L(e,a)+"</div>"}
function wn(e,a){return "<div class='warn'>⚠️ "+L(e,a)+"</div>"}
function cards(r){return "<div class='grid'>"+r.map(function(c){return "<div class='c'><i>"+c[0]+"</i><h3>"+L(c[1],c[2])+"</h3>"+L(c[3]||"",c[4]||"")+"</div>"}).join("")+"</div>"}
function tbl(h,r){return "<div class='wrap'><table><tr>"+h.map(function(x){return "<th>"+L(x[0],x[1])+"</th>"}).join("")+"</tr>"+r.map(function(row){return "<tr>"+row.map(function(x){return "<td>"+L(x[0],x[1])+"</td>"}).join("")+"</tr>"}).join("")+"</table></div>"}
function tl(r){return "<ul class='tl'>"+r.map(function(x){return "<li><b>"+x[0]+"</b>"+L(x[1],x[2])+"</li>"}).join("")+"</ul>"}
function sec(id,e,a,h){return "<section id='"+id+"'><h2>"+L(e,a)+"</h2>"+h+"</section>"}
var S=[];
S.push(["apps","Applications","التطبيقات",sec("apps","Exploring the Diverse Applications of AI","تنوع تطبيقات الذكاء الاصطناعي",
bi("<p>AI is already part of daily life: customer service, shopping, cars, drones, travel, and the apps on your phone.</p>","<p>الذكاء الاصطناعي جزء من حياتنا اليومية: خدمة العملاء، التسوق، السيارات، الطائرات المسيّرة، السفر، وتطبيقات الهاتف.</p>")+
cards([["💬","Customer Service Support","دعم خدمة العملاء","Chatbots give 24/7 instant responses (better engagement and satisfaction) and cut operational costs by automating routine inquiries.","روبوتات المحادثة تقدم دعمًا على مدار الساعة وردودًا فورية، وتخفض التكاليف بأتمتة الاستفسارات الروتينية."],
["🛒","Online Shopping","التسوق عبر الإنترنت","Personalized recommendations from user behavior and preferences. Customer analytics improve marketing strategy and retention.","توصيات مخصصة بناءً على سلوك المستخدم وتفضيلاته. وتحليل سلوك العملاء يحسّن التسويق والاحتفاظ بهم."],
["🚗","Smart Cars: Autonomous Driving","السيارات الذكية: القيادة الذاتية","AI is reshaping the automotive industry by enabling self-driving vehicles.","الذكاء الاصطناعي يعيد تشكيل صناعة السيارات عبر المركبات ذاتية القيادة."],
["🛸","Smart UAVs (Intelligent Drones)","الطائرات المسيّرة الذكية","Agriculture, search and rescue, monitoring, and delivery services.","الزراعة، البحث والإنقاذ، المراقبة، وخدمات التوصيل."],
["🧭","Travel and Navigation","السفر والملاحة","Navigation and traffic management optimize routes, cut travel time and congestion; plus personalized trip and destination suggestions.","أنظمة الملاحة وإدارة المرور تحسّن المسارات وتقلل الوقت والازدحام، مع اقتراحات سفر ووجهات مخصصة."]])+
sh("Applications Powered by AI","تطبيقات تعمل بالذكاء الاصطناعي")+
cards([["🔎","Google Search","بحث جوجل",ul(["Ranking algorithm: ML models judge page relevance and sort results","Voice search: speech recognition","Personalization from search history","Autocomplete and suggestions","Image and video search with visual input"]),ul(["خوارزمية الترتيب: نماذج تعلم آلي تقيّم صلة الصفحات وترتبها","البحث الصوتي بالتعرف على الكلام","التخصيص حسب سجل البحث","الإكمال التلقائي والاقتراحات","البحث بالصور والفيديو"])],
["👥","Facebook","فيسبوك",ul(["News Feed content personalization","Ad targeting and recommendations","Automatic image/video recognition (tagging people)","Messenger bots for business support","Voice commands and voice-to-text"]),ul(["تخصيص محتوى صفحة الأخبار","استهداف الإعلانات والتوصيات","التعرف التلقائي على الصور والفيديو (وسم الأشخاص)","روبوتات ماسنجر لدعم الأعمال","الأوامر الصوتية وتحويل الصوت إلى نص"])],
["👻","Snapchat","سناب شات",ul(["AR filters and Lenses","Snap Map","Discover content personalization","Friend suggestions","Dynamic personalized ads"]),ul(["فلاتر وعدسات الواقع المعزز","خريطة سناب","تخصيص محتوى Discover","اقتراح الأصدقاء","إعلانات ديناميكية مخصصة"])],
["📱","WhatsApp","واتساب",ul(["End-to-end encryption (as stated in the slides)","Image and video compression","Business chatbots (WhatsApp Business API)","Better search inside chats","Voice message transcription"]),ul(["التشفير من طرف إلى طرف (كما في السلايد)","ضغط الصور والفيديو","روبوتات محادثة للأعمال (WhatsApp Business API)","تحسين البحث داخل المحادثات","تحويل الرسائل الصوتية إلى نص"])]])+
wn("<b>Note:</b> the slide says WhatsApp uses AI for end-to-end encryption. In reality, encryption relies on cryptography, not AI. Write it as in the slide for the exam, but know the difference.","<b>ملاحظة:</b> السلايد يذكر أن واتساب يستخدم الذكاء الاصطناعي في التشفير. في الواقع يعتمد التشفير على علم التشفير (Cryptography) وليس الذكاء الاصطناعي. اكتبها كما في السلايد للامتحان، لكن اعرف الفرق.")+
sh("AI in Everyday Life","الذكاء الاصطناعي في الحياة اليومية")+
cards([["🗣️","Smart Assistants","المساعدات الذكية"],["📲","Social Media","وسائل التواصل"],["🛍️","Online Shopping","التسوق الإلكتروني"],["🏥","Healthcare","الرعاية الصحية"],["🚘","Autonomous Vehicles","المركبات ذاتية القيادة"],["💳","Finance","المال والتمويل"],["🎧","Customer Service","خدمة العملاء"],["🔒","Security","الأمن"],["🚆","Transportation","النقل"],["🎓","Education","التعليم"]])+
ex("From science fiction to everyday reality: AI changes the way we live and work.","من الخيال العلمي إلى الواقع اليومي: الذكاء الاصطناعي يغيّر طريقة عيشنا وعملنا.")
)]);
S.push(["modern","Modern Approach","النهج الحديث",sec("modern","AI: A Modern Approach","الذكاء الاصطناعي: نهج حديث",
bi("<p>AI is an <b>applied computing discipline</b>. It covers general subfields (learning, reasoning, perception) and specific ones (chess, proving theorems, driving, diagnosing diseases). It is relevant to any intellectual task: a <b>universal field</b> powering the <b>Fourth Industrial Revolution</b>.</p>","<p>الذكاء الاصطناعي تخصص حوسبة تطبيقي. يشمل مجالات عامة (التعلم، الاستدلال، الإدراك) ومجالات محددة (الشطرنج، إثبات النظريات، قيادة السيارات، تشخيص الأمراض). وهو مناسب لأي مهمة فكرية، فهو <b>مجال شامل</b> ويقود <b>الثورة الصناعية الرابعة</b>.</p>")+
sh("Goal: Maximize Expected Utility","الهدف: تعظيم المنفعة المتوقعة")+
bi(ul(["The goal of AI is to maximize expected <b>utility</b>.","Old view: the objective is supplied by the human designers.","<b>New view:</b> the objective is no longer assumed fixed and known. We design systems that (a) maximize utility and (b) behave properly and correctly even while <b>uncertain</b> of the objective."]),ul(["هدف الذكاء الاصطناعي هو تعظيم <b>المنفعة</b> المتوقعة.","النظرة القديمة: المصممون البشر يحددون الهدف.","<b>النظرة الحديثة:</b> لا نفترض أن الهدف ثابت ومعروف للنظام. نصمم أنظمة (أ) تعظّم المنفعة و(ب) تتصرف بشكل سليم حتى مع <b>عدم التأكد</b> من الهدف."]))+
sh("Utility vs Cost","المنفعة والتكلفة")+
bi(ul(["<b>Utility</b> = benefit or value an agent gets from a choice.","<b>Cost</b> = resources required to achieve that choice.","Trade-off: agents maximize utility while minimizing cost, seeking the greatest utility for the least cost."]),ul(["<b>المنفعة</b> = الفائدة أو القيمة التي يحصل عليها الوكيل من خيار معين.","<b>التكلفة</b> = الموارد المطلوبة لتحقيق هذا الخيار.","هناك مفاضلة: يسعى الوكيل لأعلى منفعة بأقل تكلفة."]))+
ex("Choosing a flight: a direct flight is expensive (high utility, high cost); a connecting flight is cheap. A rational agent balances them according to your preferences.","اختيار رحلة طيران: الرحلة المباشرة غالية (منفعة وتكلفة عاليتان) والرحلة بتوقف أرخص. الوكيل العقلاني يوازن بينهما حسب تفضيلاتك.")+
sh("Rationality and Decisions","العقلانية والقرارات")+
bi(ul(["Researchers defined intelligence either by <b>fidelity to human performance</b> or by an abstract formal definition: <b>rationality</b>, “doing the right thing”.","Intelligence can be seen as internal thought and reasoning, or as external <b>intelligent behavior</b>.","Rationality means achieving predefined goals, concerns the <b>decisions</b> made, and goals are expressed as the utility of outcomes. Being rational = <b>maximizing expected utility</b>."]),ul(["عرّف الباحثون الذكاء إما بالتطابق مع الأداء البشري أو بتعريف صوري مجرد: <b>العقلانية</b>، أي “فعل الشيء الصحيح”.","يمكن اعتبار الذكاء خاصية للتفكير الداخلي والاستدلال، أو للسلوك الخارجي الذكي.","العقلانية تعني تحقيق أهداف محددة مسبقًا، وتتعلق بـ<b>القرارات</b> المتخذة، وتُعبَّر الأهداف بمنفعة النتائج. أن تكون عقلانيًا = <b>تعظيم المنفعة المتوقعة</b>."]))
)]);
S.push(["four","Four Approaches","الأنواع الأربعة",sec("four","Different Types of AI","أنواع الذكاء الاصطناعي",
"<svg class='quad' viewBox='0 0 640 290' role='img' aria-label='Four approaches to AI'><g fill='#140b05' stroke='#d9480f' stroke-width='1.5'><rect x='10' y='30' width='305' height='120' rx='10'/><rect x='325' y='30' width='305' height='120' rx='10'/><rect x='10' y='160' width='305' height='120' rx='10'/><rect x='325' y='160' width='305' height='120' rx='10'/></g><g font-size='13' text-anchor='middle'><text x='162' y='18' style='fill:#ff7a1a'>Humanly | مثل البشر</text><text x='477' y='18' style='fill:#ff7a1a'>Rationally | بعقلانية</text></g><g text-anchor='middle'><text x='162' y='68' font-size='18' font-weight='700'>Thinking Humanly</text><text x='162' y='92' font-size='12'>Cognitive models of human reasoning</text><text x='162' y='112' font-size='12'>نماذج معرفية للتفكير البشري</text><text x='477' y='68' font-size='18' font-weight='700'>Thinking Rationally</text><text x='477' y='92' font-size='12'>Formal logic: how ideal agents should think</text><text x='477' y='112' font-size='12'>المنطق الصوري: كيف ينبغي أن يفكر الوكيل</text><text x='162' y='198' font-size='18' font-weight='700'>Acting Humanly</text><text x='162' y='222' font-size='12'>Models of human behavior (Turing Test)</text><text x='162' y='242' font-size='12'>نماذج السلوك البشري (اختبار تورنج)</text><text x='477' y='198' font-size='18' font-weight='700' style='fill:#ff7a1a'>Acting Rationally</text><text x='477' y='222' font-size='12'>Rational actions, black-box / engineering</text><text x='477' y='242' font-size='12'>أفعال عقلانية، نهج هندسي (الصندوق الأسود)</text></g></svg>"+
